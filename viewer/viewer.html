<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="toolbar">
  <div class="tools">
    <button type="button" id="btn-zoom-in" title="Zoom in (+)" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg>
    </button>
    <button type="button" id="btn-zoom-out" title="Zoom out (−)" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="btn-fit" class="text" title="Fit to window (A)" aria-label="Fit to window">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <span>Fit</span>
    </button>
    <button type="button" id="btn-actual" class="text" title="Actual size, 100% (1)" aria-label="Actual size">
      <span>1:1</span>
    </button>
  </div>
  <div class="info">
    <span id="info-name"></span>
    <span id="info-dims"></span>
    <span id="info-zoom"></span>
  </div>
</header>
<main id="frame">
  <div id="checker" hidden></div>
  <img id="image" alt="" draggable="false" hidden>
  <div id="message" hidden></div>
</main>
<script src="viewer.js"></script>
</body>
</html>
